apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ .Values.cluster.clusterName | default (printf "%s-cluster" .Release.Name) }}
  namespace: {{ .Release.Namespace | default "cloudnative-pg" }}
  {{- with .Values.cluster.annotations -}}
  annotations: {{ toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.cluster.affinity -}}
  affinity: {{ toYaml . | nindent 4 }}
  {{- end }}

  instances: {{ .Values.cluster.instances | default 2 }}
  
  {{- if and .Values.cluster.imageCatalogRef .Values.cluster.imageCatalogRef.name }}
  imageCatalogRef:
  {{- toYaml .Values.cluster.imageCatalogRef | nindent 4 }}
  {{- else }}
  imageName: {{ .Values.cluster.image.name | quote }}
  {{- end }}
  
  imagePullPolicy: {{ .Values.cluster.image.pullPolicy | default "IfNotPresent" }}
  
  {{- with .Values.cluster.imagePullSecrets }}
  imagePullSecrets:
    {{- toYaml . | nindent 4 }}
  {{- end }}

  storage:
    size: {{ .Values.cluster.storage.size | default "10Gi" }}
    storageClass: {{ .Values.cluster.storage.storageClass | default "openebs-hostpath" }}

  walStorage:
    size: {{ .Values.cluster.walStorage.size | default "4Gi" }}
    storageClass: {{ .Values.cluster.walStorage.storageClass | default "openebs-hostpath" }}

  {{- with .Values.cluster.resources }}
  resources:
    {{- toYaml . | nindent 4 }}
  {{- end }}

  superuserSecret:
    name: {{ .Values.cluster.superuserSecret | default "superuser-secret" }}

  enablePDB: true

  enableSuperuserAccess: {{ .Values.cluster.enableSuperuserAccess | default false }}

  {{- with .Values.cluster.postgresql }}
  postgresql:
    {{- toYaml . | nindent 4 }}
  {{- end }}

  {{- with .Values.cluster.roles }}
  managed:
    roles:
      {{- toYaml . | nindent 6 }}
  {{- end }}
  
  {{- with .Values.cluster.monitoring }}
  monitoring:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  
  {{- with .Values.cluster.plugins }}
  plugins:
    {{- toYaml . | nindent 4 }}
  {{- end }}

  {{- with .Values.cluster.bootstrap }}
  bootstrap:
    {{- toYaml . | nindent 4 }}
  {{- end }}

  {{- with .Values.cluster.externalClusters }}
  externalClusters:
    {{- toYaml . | nindent 4 }}
  {{- end }}

  {{- with .Values.cluster.backup }}
  backup:
    {{- toYaml . | nindent 4 }}
  {{- end }}

  {{- with .Values.cluster.replica }}
  replica:
    {{- toYaml . | nindent 4 }}
  {{- end }}
