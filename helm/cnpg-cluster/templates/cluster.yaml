{{- $name := include "cnpg-cluster.name" . }}
{{- $backup := include "cnpg-cluster.backup" . | fromYaml }}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace | default "cloudnative-pg" }}
  {{- with include "cnpg-cluster.annotations" (dict "ctx" . "annotations" .Values.cluster.annotations) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.cluster.affinity }}
  affinity:
    {{- toYaml . | nindent 4 }}
  {{- end }}

  # cluster.instances, else global.cnpg.instances, else 2
  instances: {{ .Values.cluster.instances | default (include "cnpg-cluster.global" (dict "ctx" . "key" "instances")) | default 2 }}
  
  {{- if and .Values.cluster.imageCatalogRef .Values.cluster.imageCatalogRef.name }}
  imageCatalogRef:
  {{- toYaml .Values.cluster.imageCatalogRef | nindent 4 }}
  {{- else }}
  imageName: {{ .Values.cluster.image.name | quote }}
  {{- end }}
  
  imagePullPolicy: {{ .Values.cluster.image.pullPolicy | default "IfNotPresent" }}
  
  {{- with .Values.cluster.imagePullSecrets }}
  imagePullSecrets:
    {{- toYaml . | nindent 4 }}
  {{- end }}

  {{- $storageClass := include "cnpg-cluster.global" (dict "ctx" . "key" "storageClass") | default "openebs-hostpath" }}
  storage:
    size: {{ .Values.cluster.storage.size | default "10Gi" }}
    storageClass: {{ .Values.cluster.storage.storageClass | default $storageClass }}

  walStorage:
    size: {{ .Values.cluster.walStorage.size | default "4Gi" }}
    storageClass: {{ .Values.cluster.walStorage.storageClass | default $storageClass }}

  {{- with .Values.cluster.resources }}
  resources:
    {{- toYaml . | nindent 4 }}
  {{- end }}

  superuserSecret:
    name: {{ .Values.cluster.superuserSecret | default "superuser-secret" }}

  enablePDB: true

  enableSuperuserAccess: {{ .Values.cluster.enableSuperuserAccess | default false }}

  {{- with .Values.cluster.postgresql }}
  postgresql:
    {{- toYaml . | nindent 4 }}
  {{- end }}

  {{- if or .Values.cluster.roles .Values.cluster.managedServices }}
  managed:
    {{- with .Values.cluster.roles }}
    roles:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with .Values.cluster.managedServices }}
    services:
      {{- toYaml . | nindent 6 }}
    {{- end }}
  {{- end }}

  {{- with .Values.cluster.certificates }}
  certificates:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  
  {{- with .Values.cluster.monitoring }}
  monitoring:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  
  {{- $plugins := .Values.cluster.plugins | default list }}
  {{- if $backup.on }}
  {{- /* backup: continuous WAL archiving to the ObjectStore of templates/backup-s3.yaml */}}
  {{- /* enabled: the CRD default, explicit or Argo CD (server-side diff) shows the Cluster OutOfSync forever */}}
  {{- $plugins = append $plugins (dict "name" "barman-cloud.cloudnative-pg.io" "enabled" true "isWALArchiver" true "parameters" (dict "barmanObjectName" $backup.objectStore)) }}
  {{- end }}
  {{- with $plugins }}
  plugins:
    {{- toYaml . | nindent 4 }}
  {{- end }}

  {{- $bootstrap := .Values.cluster.bootstrap }}
  {{- $externalClusters := .Values.cluster.externalClusters | default list }}
  {{- if and $backup.on $backup.restoreFrom (not $bootstrap) }}
  {{- /* backup.restore.from: a NEW cluster starts from the backups of the old one (same name, other path) */}}
  {{- /* database/owner/isWALArchiver: CRD defaults, explicit or Argo CD shows the Cluster OutOfSync while restoring */}}
  {{- $recovery := dict "source" "origin" "database" "app" "owner" "app" }}
  {{- with (dig "restore" "targetTime" "" $backup) }}
  {{- $_ := set $recovery "recoveryTarget" (dict "targetTime" .) }}
  {{- end }}
  {{- $bootstrap = dict "recovery" $recovery }}
  {{- $externalClusters = append $externalClusters (dict "name" "origin" "plugin" (dict "name" "barman-cloud.cloudnative-pg.io" "enabled" true "isWALArchiver" false "parameters" (dict "barmanObjectName" (printf "%s-restore" $name) "serverName" $name))) }}
  {{- end }}
  {{- with $bootstrap }}
  bootstrap:
    {{- toYaml . | nindent 4 }}
  {{- end }}

  {{- with $externalClusters }}
  externalClusters:
    {{- toYaml . | nindent 4 }}
  {{- end }}

  {{- with .Values.cluster.backup }}
  backup:
    {{- toYaml . | nindent 4 }}
  {{- end }}

  {{- with .Values.cluster.replica }}
  replica:
    {{- toYaml . | nindent 4 }}
  {{- end }}
