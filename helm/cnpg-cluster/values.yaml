# -- Cloudnative-pg cluster configuration
cluster:
  # -- Name of the cluster, default to releaseName-cluster
  clusterName: ""

  # -- Replica configuration
  # https://cloudnative-pg.io/docs/1.30/replica_cluster/
  replica: {}
  
  # -- Instances number
  instances: 2
  annotations: {}
  affinity: {}

  # -- Select image to use
  # imageCatalogRef:
  #   apiGroup: postgresql.cnpg.io
  #   kind: ClusterImageCatalog
  #   name: postgresql-standard-trixie
  #   major: 16
  imageCatalogRef: {}

  # WARNING: Either use imageCatalogRef or specify the image directly
  # -- Image configuration
  image:
    name: ghcr.io/cloudnative-pg/postgresql:18-standard-trixie@sha256:d393376fb67a2df53bb09acae89b39b2742b77519b4bc59f337ca9dfb7455cb1

  storage:
    storageClass: openebs-hostpath
    size: 8Gi
  # -- Activate wal storage for high availability
  walStorage:
    storageClass: openebs-hostpath
    size: 1Gi

  # -- Certificates configuration pass-through to Cluster.spec.certificates
  # https://cloudnative-pg.io/docs/1.30/certificates/
  certificates: {}

  # -- Enable external service to expose the primary instance
  externalService:
    enabled: false
    targetInstanceRole: primary
    annotations: {}
    loadBalancerClass: ""
    loadBalancerIP: ""
    # -- Restrict access to specific IP ranges (e.g. private VPC/VPN subnets)
    loadBalancerSourceRanges: []
    # -- Explicitly allow all sources (0.0.0.0/0) if no source ranges are provided
    allowAllSources: false

  # -- Postgresql configuration
  # https://cloudnative-pg.io/docs/1.28/postgresql_conf/
  postgresql: {}

  # -- Admin superuser
  superuserSecret: superuser-secret
  enableSuperuserAccess: true
  refreshPasswordInterval: 0s

  # -- Define roles that will be created in the cluster at startup
  # roles:
  #   - name: a4-bitcoin-testnet
  #     ensure: present
  #     superuser: false
  #     login: true
  #     createdb: true
  #     passwordSecret:
  #       name: a4-bitcoin-testnet-cnpg
  roles: []

  # -- Bootstrap configuration for new cluster
  # bootstrap:
  #   initdb:
  #     database: app
  #     owner: app
  #     dataChecksums: true
  #     encoding: 'LATIN1'
  #     postInitSQL:
  #           - CREATE DATABASE angus
  #
  # -- Recover from backup
  # https://cloudnative-pg.io/docs/1.28/recovery/
  # bootstrap:
  #   recovery:
  #     source: origin
  bootstrap: {}

  # -- Resource requests and limits
  # resources:
  #   limits:
  #     cpu: "4"
  #     memory: 8Gi
  #   requests:
  #     cpu: "4"
  #     memory: 8Gi
  resources: {}

  # -- Monitoring configuration
  # https://cloudnative-pg.io/docs/1.28/monitoring/
  monitoring: {}

  # -- Create PodMonitor for Prometheus Operator
  podMonitor:
    enabled: false

  # -- Enable backup to object store for this cluster
  # https://cloudnative-pg.io/plugin-barman-cloud/docs/concepts/
  # plugins:
  #   - name: barman-cloud.cloudnative-pg.io
  #     isWALArchiver: true
  #     parameters:
  #       barmanObjectName: s3-storage
  plugins: []

  # -- Enable backup configuration
  backup: {}

  # -- Connect to an external cluster for recovery or replication
  # https://cloudnative-pg.io/docs/1.30/replica_cluster/
  # externalClusters:
  #   - name: primary-dc
  #     connectionParameters:
  #       host: 10.100.0.50
  #       user: streaming_replica
  #       dbname: postgres
  #       sslmode: verify-full
  #       sslrootcert: /etc/ssl/postgres/ca.crt
  #       sslcert: /etc/ssl/postgres/tls.crt
  #       sslkey: /etc/ssl/postgres/tls.key
  #     sslRootCert:
  #       name: postgres-ca
  #       key: ca.crt
  #     sslCert:
  #       name: postgres-client-cert
  #       key: tls.crt
  #     sslKey:
  #       name: postgres-client-key
  #       key: tls.key
  externalClusters: []

# -- Create db on cloudnative-pg
database:
  # Auto generate password for each database
  autoGeneratePassword: true
  refreshPasswordInterval: 0s
  databaseReclaimPolicy: retain

  # -- Create db on cloudnative-pg
  # list:
  #   - name: database1
  #     owner: database1-owner
  #     secretName: database1-secret
  #     # Recovery job use pgcopydb to restore database. Make sure the image below has pgcopydb installed
  #     recovery:
  #       enabled: false
  #       imageName: ghcr.io/cloudnative-pg/postgresql:16.2-16
  #       dbSourceHost: <db-source-host>
  #       dbSourceSecretName: <db-source-secret-name>
  #     extensions:
  #       - name: extension_name
  #         ensure: present
  #     schemas:
  #       - name: datadog
  #         owner: datadog
  #         ensure: present
  #     # -- Enable logical replication for each database. It will create publication/subscription for upgrading purposes.
  #     # -- https://cloudnative-pg.io/docs/1.28/logical_replication
  #     # -- https://www.postgresql.org/docs/current/logical-replication-subscription.html
  #     logicalReplication:
  #       # Either you enable publication or subscription, not both
  #       publication:
  #         enabled: false
  #         target: {}
  #       subscription:
  #         enabled: false
  #         # You must define externalClusterName in cluster.externalClusters to use subscription
  #         externalClusterName: ""
  list: []


# -- Scheduled Backup configuration
scheduledBackup:
  plugin:
    enabled: false
    scheduledBackup: "0 0 0 * * *" # Every day at midnight
    name: barman-cloud.cloudnative-pg.io
  volumeSnapshot:
    enabled: false
    scheduledBackup: "0 0 0 * * *" # Every day at midnight
    retentionDays: 7
    retentionImage: "debian:trixie-slim" # Must contain curl and jq


# -- Object Store configuration
# objectStore:
#   enabled: true
#   name: s3-storage
#   spec:
#     configuration:
#       destinationPath: s3://backup
#       endpointURL: http://s3.minio.svc.cluster.local:9000
#       s3Credentials:
#         # Key should be named as ACCESS_KEY_ID and ACCESS_SECRET_KEY
#         accessKeyId:
#           name: s3-minio-secret
#           key: MINIO_ROOT_USER
#         secretAccessKey:
#           name: s3-minio-secret
#           key: MINIO_ROOT_PASSWORD
#       wal:
#         compression: gzip
#     retentionPolicy: 30d
objectStore:
  enabled: false
