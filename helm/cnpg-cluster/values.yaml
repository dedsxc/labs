# -- Cloudnative-pg cluster configuration
cluster:
  # -- Name of the cluster, default to releaseName-cluster
  clusterName: ""

  # -- Replica configuration
  # https://cloudnative-pg.io/docs/1.30/replica_cluster
  replica: {}
  
  # -- Instances number. Empty: global.cnpg.instances, else 2. One node: 1 (two instances on one disk is not HA)
  instances:
  annotations: {}
  affinity: {}

  # -- Never let Argo CD delete the database: adds argocd.argoproj.io/sync-options Prune=false,Delete=false
  # to the Cluster (merged with the sync options set in annotations), Delete=false to the backup resources.
  # Removing the chart from Git, or deleting the Argo CD Application, then keeps the Cluster, its volumes
  # and its backups running. Delete it on purpose with kubectl delete cluster <name>.
  keepOnDelete: true

  # -- Select image to use
  # imageCatalogRef:
  #   apiGroup: postgresql.cnpg.io
  #   kind: ClusterImageCatalog
  #   name: postgresql-standard-trixie
  #   major: 16
  imageCatalogRef: {}

  # WARNING: Either use imageCatalogRef or specify the image directly
  # -- Image configuration
  image:
    name: ghcr.io/cloudnative-pg/postgresql:18-standard-trixie@sha256:d393376fb67a2df53bb09acae89b39b2742b77519b4bc59f337ca9dfb7455cb1

  # storageClass empty: global.cnpg.storageClass, else openebs-hostpath.
  # Prefer a StorageClass with reclaimPolicy Retain: the data then survives a deleted PVC or namespace.
  storage:
    storageClass: ""
    size: 8Gi
  # -- Activate wal storage for high availability
  walStorage:
    storageClass: ""
    size: 1Gi

  # -- Postgresql configuration
  # https://cloudnative-pg.io/docs/1.28/postgresql_conf/
  postgresql: {}

  # -- Admin superuser
  superuserSecret: superuser-secret
  enableSuperuserAccess: true
  refreshPasswordInterval: 0s

  # -- Define roles that will be created in the cluster at startup
  # roles:
  #   - name: a4-bitcoin-testnet
  #     ensure: present
  #     superuser: false
  #     login: true
  #     createdb: true
  #     passwordSecret:
  #       name: a4-bitcoin-testnet-cnpg
  roles: []

  # -- Managed services (pass-through to Cluster.spec.managed.services)
  # https://cloudnative-pg.io/docs/1.28/service_management/
  # managedServices:
  #   disabledDefaultServices: ["ro", "r"]
  #   additional:
  #     - selectorType: rw
  #       updateStrategy: patch
  #       serviceTemplate:
  #         metadata:
  #           name: my-cluster-rw-lb
  #         spec:
  #           type: LoadBalancer
  managedServices: {}

  # -- Certificates (pass-through to Cluster.spec.certificates)
  # https://cloudnative-pg.io/docs/1.28/certificates/
  # certificates:
  #   serverTLSSecret: my-cluster-server-tls
  #   serverCASecret: my-cluster-server-ca
  #   clientCASecret: my-cluster-client-ca
  #   replicationTLSSecret: my-cluster-replication-tls
  #   serverAltDNSNames: ["pg.example.com"]
  certificates: {}

  # -- Bootstrap configuration for new cluster
  # bootstrap:
  #   initdb:
  #     database: app
  #     owner: app
  #     dataChecksums: true
  #     encoding: 'LATIN1'
  #     postInitSQL:
  #           - CREATE DATABASE angus
  #
  # -- Recover from backup
  # https://cloudnative-pg.io/docs/1.28/recovery/
  # bootstrap:
  #   recovery:
  #     source: origin
  bootstrap: {}

  # -- Resource requests and limits
  # resources:
  #   limits:
  #     cpu: "4"
  #     memory: 8Gi
  #   requests:
  #     cpu: "4"
  #     memory: 8Gi
  resources: {}

  # -- Monitoring configuration
  # https://cloudnative-pg.io/docs/1.28/monitoring/
  monitoring: {}

  # -- Create PodMonitor for Prometheus Operator
  podMonitor:
    enabled: false

  # -- Enable backup to object store for this cluster
  # https://cloudnative-pg.io/plugin-barman-cloud/docs/concepts/
  # plugins:
  #   - name: barman-cloud.cloudnative-pg.io
  #     isWALArchiver: true
  #     parameters:
  #       barmanObjectName: s3-storage
  plugins: []

  # -- Enable backup configuration
  backup: {}

  # -- Connect to an external cluster for recovery
  # https://cloudnative-pg.io/docs/1.28/recovery/
  # externalClusters:
  #   - name: origin
  #     plugin:
  #       name: barman-cloud.cloudnative-pg.io
  #       parameters:
  #         barmanObjectName: cluster-example-backup
  #         serverName: cluster-example
  externalClusters: []

# -- Create db on cloudnative-pg
database:
  # Auto generate password for each database
  autoGeneratePassword: true
  refreshPasswordInterval: 0s
  databaseReclaimPolicy: retain

  # -- Create db on cloudnative-pg
  # list:
  #   - name: database1
  #     owner: database1-owner
  #     secretName: database1-secret
  #     # Recovery job use pgcopydb to restore database. Make sure the image below has pgcopydb installed
  #     recovery:
  #       enabled: false
  #       imageName: ghcr.io/cloudnative-pg/postgresql:16.2-16
  #       dbSourceHost: <db-source-host>
  #       dbSourceSecretName: <db-source-secret-name>
  #     extensions:
  #       - name: extenstion_name
  #         ensure: present
  #     schemas:
  #       - name: datadog
  #         owner: datadog
  #         ensure: present
  #     # -- Enable logical replication for each database. It will create publication/subscription for upgrading purposes.
  #     # -- https://cloudnative-pg.io/docs/1.28/logical_replication
  #     # -- https://www.postgresql.org/docs/current/logical-replication-subscription.html
  #     logicalReplication:
  #       # Either you enable publication or subscription, not both
  #       publication:
  #         enabled: false
  #         target: {}
  #       subscription:
  #         enabled: false
  #         # You must define externalClusterName in cluster.externalClusters to use subscription
  #         externalClusterName: ""
  list: []


# -- Off-cluster backups in one block (Barman Cloud plugin): an ObjectStore, continuous WAL archiving and a
# daily ScheduledBackup, i.e. point-in-time recovery. Off until s3.destinationPath is set, here or in
# global.backup (umbrella charts set it once for every cnpg-cluster subchart; any key set here wins).
# Needs the plugin-barman-cloud chart next to the CloudNativePG operator (it uses cert-manager).
# Files go to <destinationPath>/<namespace>/<clusterName>/ (WAL in wals/, base backups in base/).
# Empty keys use the defaults in brackets.
backup:
  # -- false: never back up this cluster, even when global.backup.s3.destinationPath is set
  enabled: true
  s3:
    # -- s3://<bucket>[/<prefix>]. Use a bucket OUTSIDE this Kubernetes cluster: in-cluster storage is lost with it
    destinationPath: ""
    # -- S3-compatible endpoint, e.g. https://s3.fr-par.scw.cloud (empty: AWS S3)
    endpointURL: ""
    # -- Region, written as ACCESS_REGION in the credentials Secret (empty: none)
    region: ""
    # -- Secret in this namespace with ACCESS_KEY_ID and ACCESS_SECRET_KEY [<clusterName>-backup-s3]
    secretName: ""
    # -- Copy that Secret with External Secrets from this ClusterSecretStore (empty: the Secret must exist)
    clusterSecretStore: ""
    # -- Key of the source Secret in that store (it holds ACCESS_KEY_ID and ACCESS_SECRET_KEY)
    remoteKey: ""
  # -- How long base backups and WAL are kept [30d]
  retentionPolicy: ""
  # -- Base backup schedule, 6 fields with seconds first ["0 0 2 * * *": 02:00 every day]
  schedule: ""
  # -- Resources of the plugin sidecar added to each Postgres pod [requests 10m/64Mi, limit 512Mi]
  sidecarResources: {}
  # -- Disaster recovery: a NEW cluster starts from the backups found under <from>/<namespace>/<clusterName>/
  # (the destinationPath of the lost cluster), then archives to s3.destinationPath, which must be a different
  # path. Ignored when cluster.bootstrap is set, and by CloudNativePG once the cluster exists.
  restore:
    from: ""
    # -- Point in time to stop at (RFC 3339, e.g. "2026-11-16T10:00:00Z"); empty: the end of the archived WAL
    targetTime: ""

# -- Scheduled Backup configuration (manual alternative to `backup`: use one or the other)
scheduledBackup:
  plugin:
    enabled: false
    scheduledBackup: "0 0 0 * * *" # Every day at midnight
    name: barman-cloud.cloudnative-pg.io
  # Needs a CSI driver with VolumeSnapshot support: NOT OpenEBS hostpath / local-path (no snapshots).
  volumeSnapshot:
    enabled: false
    scheduledBackup: "0 0 0 * * *" # Every day at midnight
    retentionDays: 7
    retentionImage: "debian:trixie-slim" # Must contain curl and jq


# -- Object Store configuration (manual alternative to `backup`)
# objectStore:
#   enabled: true
#   name: s3-storage
#   spec:
#     configuration:
#       # A bucket outside the cluster (AWS S3, Scaleway, OVH, Cloudflare R2, a MinIO on another machine...)
#       destinationPath: s3://my-backups/postgres
#       endpointURL: https://s3.fr-par.scw.cloud
#       s3Credentials:
#       # Key should be named as ACCESS_KEY_ID and ACCESS_SECRET_KEY
#         accessKeyId:
#           name: backup-s3
#           key: ACCESS_KEY_ID
#         secretAccessKey:
#           name: backup-s3
#           key: ACCESS_SECRET_KEY
#       wal:
#         compression: gzip
#     retentionPolicy: 30d
objectStore:
  enabled: false
